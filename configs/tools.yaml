  - name: nmap
    category: recon
    binary: nmap
    package: nmap
    version_command: "nmap --version"
    install_method: apt
    purpose: "Network port scanner and service detection"
    input_types: [ip, host, cidr]
    risk: medium
    local_only: false
    recommended_for: [network, web, recon]
    alternatives: [rustscan, masscan]

  - name: rustscan
    category: recon
    binary: rustscan
    package: rustscan
    version_command: "rustscan --version"
    install_method: apt
    purpose: "Fast port scanner (Rust-based, feeds to nmap)"
